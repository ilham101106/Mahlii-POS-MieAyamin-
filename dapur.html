<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MieAyamin POS - Mode Dapur (Kitchen Display System)</title>
  <!-- PWA & iOS Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d97706">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MieAyamin POS">
  <link rel="apple-touch-icon" href="images/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* --- KDS Specific Overrides --- */
    .kds-header-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    body {
      background: var(--bg-canvas);
      color: var(--text-main);
    }
    .kds-filters {
      display: flex;
      gap: 10px;
      padding: 14px 28px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .kds-filter-btn {
      background: var(--bg-card-subtle, #f8fafc);
      border: 1.5px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s;
    }
    .kds-filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(217,119,6,0.3);
    }
    .kds-filter-btn:hover:not(.active) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light, #fef3c7);
    }
    .kds-container {
      padding: 24px 28px;
      max-width: 1440px;
      margin: 0 auto;
    }
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }
    @media (max-width: 900px) {
      .kds-header-bar { flex-direction: column; align-items: stretch; gap: 10px; padding: 10px 14px; }
      .kds-filters { padding: 10px 14px; overflow-x: auto; flex-wrap: nowrap; }
      .kds-filter-btn { flex-shrink: 0; padding: 6px 14px; font-size: 0.8rem; }
      .kds-container { padding: 12px; }
      .kds-grid { grid-template-columns: 1fr; }
    }

    /* KDS Order Cards */
    .kds-card {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .kds-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.09); }
    .kds-card.status-masuk   { border-top: 5px solid #10b981; }
    .kds-card.status-diproses { border-top: 5px solid #d97706; }
    .kds-card.status-selesai  { border-top: 5px solid #94a3b8; opacity: 0.65; }

    .kds-card-header {
      padding: 14px 18px;
      background: var(--bg-card-subtle, #f8fafc);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kds-table { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
    .kds-customer { font-size: 0.82rem; color: var(--text-muted); display: block; margin-top: 2px; font-weight: 600; }

    .kds-timer {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      background: #d1fae5;
      color: #047857;
      transition: background 0.3s, color 0.3s;
    }
    .kds-timer.warn  { background: #fef3c7; color: #92400e; }
    .kds-timer.urgent { background: #fee2e2; color: #b91c1c; animation: pulse-border 1s infinite; }
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50%       { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }

    .kds-card-body { padding: 14px 18px; flex: 1; }
    .kds-item-list { list-style: none; padding: 0; margin: 0; }
    .kds-item-list li {
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .kds-item-list li:last-child { border-bottom: none; }
    .kds-item-qty {
      background: var(--primary-light, #fef3c7);
      color: var(--primary);
      font-weight: 800;
      font-size: 0.9rem;
      padding: 2px 10px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .kds-item-name { font-size: 0.97rem; color: var(--text-main); font-weight: 700; }
    .kds-item-note { font-size: 0.82rem; color: #d97706; display: block; font-weight: 600; margin-top: 2px; }

    .kds-card-footer {
      padding: 12px 18px;
      background: var(--bg-card-subtle, #f8fafc);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .kds-status-label {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .status-masuk .kds-status-label   { background: #d1fae5; color: #047857; }
    .status-diproses .kds-status-label { background: #fef3c7; color: #92400e; }
    .status-selesai .kds-status-label  { background: #f1f5f9; color: #64748b; }

    .kds-btn-next {
      flex: 1;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(217,119,6,0.25);
    }
    .kds-btn-next:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(217,119,6,0.35); }
    .kds-btn-next:disabled { background: #e2e8f0; color: #94a3b8; box-shadow: none; transform: none; cursor: not-allowed; }

    .kds-active-badge {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 1.5px solid rgba(217,119,6,0.3);
      color: #92400e;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.88rem;
    }

    .kds-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .kds-empty h3 { font-size: 1.2rem; color: var(--text-main); margin-bottom: 6px; }

    .kds-type-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
      background: var(--primary-light, #fef3c7);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Header Dapur -->
  <header class="kds-header-bar">
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="font-size:1.8rem; background:#fef3c7; padding:8px 14px; border-radius:14px; border:1px solid rgba(217,119,6,0.25);">🍜</div>
      <div>
        <h1 style="font-size:1.3rem; font-weight:800; margin:0; color:var(--text-main);">MieAyamin <span style="color:var(--primary);">DAPUR</span></h1>
        <small style="color:var(--text-muted); font-weight:600;">Layar Antrean Masakan (Kitchen Display)</small>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <div class="kds-active-badge">
        Aktif: <span id="kdsActiveCountBadge">0</span> Pesanan
      </div>
      <div class="live-clock" id="liveClock" style="color:var(--text-muted); font-weight:700; font-size:0.9rem;"></div>
      <a href="index.html" class="btn btn-secondary btn-sm" title="Kembali ke Kasir / Beralih Role">
        Beralih Role
      </a>
    </div>
  </header>

  <!-- Filter Status Pesanan -->
  <div class="kds-filters">
    <button class="kds-filter-btn active" data-status="all">Semua Pesanan</button>
    <button class="kds-filter-btn" data-status="Masuk">Baru Masuk</button>
    <button class="kds-filter-btn" data-status="Diproses">Sedang Dimasak</button>
    <button class="kds-filter-btn" data-status="Selesai">Selesai</button>
  </div>

  <!-- KDS Main Grid -->
  <main class="kds-container">
    <div class="kds-grid" id="kdsOrdersGrid">
      <!-- Rendered via JS -->
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/storage.js"></script>
  <script src="js/dapur.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('PWA ServiceWorker registered:', reg.scope);
        }).catch((err) => {
          console.log('ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
